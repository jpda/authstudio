server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Authorization servers fetch these. A changed origin must not be served from cache.
    location ~ ^/(client|private-client|local|private-local)\.json$ {
        add_header Cache-Control "no-cache";
    }

    # Resolvable negative-test documents for authorization servers; see README.
    location ^~ /cimd-e2e/ {
        add_header Cache-Control "no-cache";
        location = /cimd-e2e/redirect-loopback.json {
            return 302 https://127.0.0.1:47123/client.json;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
