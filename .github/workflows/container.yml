name: Publish container

on:
  workflow_call:
    inputs:
      version:
        description: Image tag shared with the git release, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      setup-qemu: false
      cache: true
      cache-mode: max
      sbom: true
      set-meta-labels: true
      set-meta-annotations: true
      build-args: |
        SOURCE_REVISION=${{ github.sha }}
        REPOSITORY_URL=https://github.com/${{ github.repository }}
      meta-images: ${{ needs.prepare.outputs.image }}
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ inputs.version }}
        type=sha,format=long
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}